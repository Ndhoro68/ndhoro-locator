<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDHORO Admin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b0e14;color:#e8edf5;padding:16px;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto}
  h1{color:#3b82f6;font-size:22px;margin-bottom:6px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:20px}
  .card{background:#0f1520;border:1px solid #1a2130;border-radius:16px;padding:20px;margin-bottom:16px}
  .card h2{font-size:15px;margin-bottom:12px;color:#60a5fa;display:flex;justify-content:space-between}
  .count{background:#1e293b;padding:2px 10px;border-radius:20px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{border-bottom:1px solid #1a2130;padding:8px 6px;text-align:left;vertical-align:top}
  th{color:#94a3b8;font-weight:500;font-size:11px;text-transform:uppercase}
  tr:last-child td{border-bottom:0}
  .tok{color:#60a5fa;font-family:monospace;cursor:pointer}
  .tok:hover{text-decoration:underline}
  .url{color:#94a3b8;font-family:monospace;font-size:11px;word-break:break-all}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px}
  .b-active{background:#10b98120;color:#10b981}
  .b-used{background:#f59e0b20;color:#f59e0b}
  input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #1e2a3a;background:#0a0c12;color:#e8edf5;font-size:13px;margin-bottom:10px}
  button{padding:10px 20px;border-radius:10px;border:1px solid #1e40af;background:#1e3a8a;color:#fff;font-size:13px;cursor:pointer}
  button:hover{background:#1e40af}
  .empty{color:#64748b;font-size:13px;text-align:center;padding:20px}
  .time{color:#64748b;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 NDHORO Admin</h1>
  <div class="sub">Monitor semua link yang beredar</div>

  <div class="card">
    <input type="password" id="keyInput" placeholder="masukkan ADMIN_KEY...">
    <button onclick="load()">Muat Data</button>
  </div>

  <div id="content" style="display:none">
    <div class="card">
      <h2>Aktif <span class="count" id="cActive">0</span></h2>
      <div id="activeList"><div class="empty">—</div></div>
    </div>

    <div class="card">
      <h2>Sudah Dibuka <span class="count" id="cLog">0</span></h2>
      <div id="logList"><div class="empty">—</div></div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const keyFromUrl = params.get('key');
if(keyFromUrl) document.getElementById('keyInput').value = keyFromUrl;

function fmtTime(epoch){
  if(!epoch) return '-';
  const d = new Date(epoch * 1000);
  return d.toLocaleString('id-ID');
}
function fmtRemain(sec){
  if(sec == null) return '-';
  if(sec < 0) return 'expired';
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  if(h>0) return h+'h '+m+'m';
  return m+'m';
}

async function load(){
  const key = document.getElementById('keyInput').value.trim();
  if(!key){ alert('masukkan ADMIN_KEY'); return; }

  try{
    const r = await fetch('/api/admin/list?key=' + encodeURIComponent(key));
    const j = await r.json();
    if(r.status === 401){ alert('ADMIN_KEY salah'); return; }
    if(j.error){ alert('error: ' + j.error); return; }

    document.getElementById('content').style.display = 'block';
    document.getElementById('cActive').textContent = j.active_count;
    document.getElementById('cLog').textContent = j.log_count;

    // aktif
    const activeEl = document.getElementById('activeList');
    if(j.active.length === 0){
      activeEl.innerHTML = '<div class="empty">—</div>';
    } else {
      let html = '<table><tr><th>Token</th><th>Tujuan</th><th>Expires</th></tr>';
      for(const a of j.active){
        html += `<tr>
          <td><span class="tok" onclick="copyUrl('${a.url}')">${a.token}</span></td>
          <td class="url">${a.target || '-'}</td>
          <td class="time">${fmtRemain(a.ttl_remaining)}</td>
        </tr>`;
      }
      html += '</table>';
      activeEl.innerHTML = html;
    }

    // log
    const logEl = document.getElementById('logList');
    if(j.logs.length === 0){
      logEl.innerHTML = '<div class="empty">—</div>';
    } else {
      let html = '<table><tr><th>Token</th><th>Tujuan</th><th>Dibuka</th></tr>';
      for(const l of j.logs){
        html += `<tr>
          <td><span class="tok">${l.token}</span></td>
          <td class="url">${l.target || '-'}</td>
          <td class="time">${fmtTime(l.used_at)}</td>
        </tr>`;
      }
      html += '</table>';
      logEl.innerHTML = html;
    }
  }catch(e){
    alert('gagal: ' + e.message);
  }
}

function copyUrl(u){
  navigator.clipboard.writeText(u);
  alert('URL dicopy:\n' + u);
}

// auto-load kalau ada ?key= di URL
if(keyFromUrl) load();
</script>
</body>
</html>
